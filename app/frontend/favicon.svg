<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad-matrix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#00f59b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Volcanic Matte Card Background -->
  <rect width="64" height="64" rx="16" fill="#08090b" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#grad-glow)" stroke-width="1.5" />

  <!-- Isometric Vector Matrix Topology -->
  <g filter="url(#glow)" transform="translate(4, 4)">
    <!-- Polygons -->
    <polygon points="28 8 52 20 28 32 4 20" fill="url(#grad-matrix)" opacity="0.9" />
    <polyline points="4 36 28 48 52 36" fill="none" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="4 24 28 36 52 24" fill="none" stroke="#00f59b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Vertices -->
    <circle cx="28" cy="8" r="3.5" fill="#ffffff" />
    <circle cx="52" cy="20" r="3.5" fill="#fbbf24" />
    <circle cx="4" cy="20" r="3.5" fill="#00f59b" />
    <circle cx="28" cy="32" r="4" fill="#ffffff" />
    <circle cx="28" cy="48" r="3.5" fill="#00f59b" />
  </g>
</svg>
